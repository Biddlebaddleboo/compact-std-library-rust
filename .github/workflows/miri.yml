name: Miri unsafe-code checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miri:
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-disable-isolation
      PROPTEST_CASES: 16
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Set up Miri
        run: cargo miri setup
      - name: Core allocator and packed memory
        run: cargo miri test -p compact_core
      - name: Cage collection ownership and ring operations
        run: cargo miri test -p compact_collections --test cage_collections
      - name: Borrow-scoped deque batch view
        run: cargo miri test -p compact_collections --test deque_view
      - name: Cage allocator ownership and drop behavior
        run: cargo miri test -p compact_backend_std --test integration
      - name: Intrusive allocator invariants
        run: cargo miri test -p compact_backend_std --lib
      - name: V2.4 frozen and Serde behavior
        run: cargo miri test -p compact_std --all-features --test v2_4
