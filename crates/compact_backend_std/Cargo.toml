[package]
name = "compact_backend_std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Process-wide compact cage runtime"
keywords = ["cage", "memory", "compact", "std"]
categories = ["memory-management"]

[features]
allocator-telemetry = []
# Policy matrix: A=classes on/pending off, B=pending on/classes off,
# C=pending on/classes on. No policy flag selects the optimized B default;
# when multiple flags are set, C wins.
benchmark-allocator-a = []
benchmark-allocator-b = []
benchmark-allocator-c = []

[dependencies]
compact_core = { version = "2.4.0", path = "../compact_core" }

[dev-dependencies]
proptest = "=1.6.0"
