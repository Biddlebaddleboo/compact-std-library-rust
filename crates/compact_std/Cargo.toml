[package]
name = "compact_std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Ergonomic facade for compact cage Rust"
keywords = ["cage", "compact", "std"]
categories = ["data-structures", "memory-management"]

[dependencies]
compact_serde = { path = "../compact_serde", version = "2.4.0", optional = true }
compact_frozen = { path = "../compact_frozen", version = "2.4.0" }
compact_core = { path = "../compact_core", version = "2.4.0" }
compact_backend_std = { path = "../compact_backend_std", version = "2.4.0" }
compact_collections = { path = "../compact_collections", version = "2.4.0" }
compact_macros = { path = "../compact_macros", version = "2.4.0" }

[features]
default = []
serde = ["dep:compact_serde"]
json = ["serde", "compact_serde/json"]
toml = ["serde", "compact_serde/toml"]

[dev-dependencies]
proptest = "=1.6.0"

[[example]]
name = "workloads_bench"
required-features = ["json", "toml"]
