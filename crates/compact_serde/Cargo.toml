[package]
name = "compact_serde"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Direct Serde deserialization into compact arena collections"
keywords = ["serde", "arena", "compact"]
categories = ["encoding", "data-structures", "memory-management"]

[features]
default = []
json = ["dep:serde_json"]
toml = ["dep:toml"]

[dependencies]
compact_core = { path = "../compact_core", version = "2.1.0" }
compact_collections = { path = "../compact_collections", version = "2.1.0" }
serde = "1"
serde_json = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
